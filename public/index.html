    <!-- Early script to suppress benign ResizeObserver dev overlay errors before React mounts -->
    <script>
      (function () {
        try {
          // Install global handlers as early as possible to block the CRA red overlay
          function swallowROMessage(msg) {
            return msg && msg.indexOf && msg.indexOf('ResizeObserver loop completed') !== -1;
          }

          window.addEventListener('error', function (e) {
            var message = e && (e.message || (e.error && e.error.message) || '');
            if (swallowROMessage(message)) {
              try { e.stopImmediatePropagation && e.stopImmediatePropagation(); } catch (err) {}
              try { e.preventDefault && e.preventDefault(); } catch (err) {}
              console.warn('Suppressed early ResizeObserver error:', message);
            }
          }, true);

          window.addEventListener('unhandledrejection', function (e) {
            var reason = e && (e.reason && (e.reason.message || e.reason) || '');
            if (swallowROMessage(reason)) {
              try { e.stopImmediatePropagation && e.stopImmediatePropagation(); } catch (err) {}
              try { e.preventDefault && e.preventDefault(); } catch (err) {}
              console.warn('Suppressed early ResizeObserver unhandledrejection:', reason);
            }
          }, true);

          // Defensive monkey-patch for ResizeObserver.observe
          if (window.ResizeObserver && window.ResizeObserver.prototype && window.ResizeObserver.prototype.observe) {
            var orig = window.ResizeObserver.prototype.observe;
            window.ResizeObserver.prototype.observe = function () {
              try {
                return orig.apply(this, arguments);
              } catch (err) {
                if (err && err.message && err.message.indexOf('ResizeObserver loop completed') !== -1) {
                  console.warn('Suppressed ResizeObserver.observe error:', err.message);
                  return;
                }
                throw err;
              }
            };
          }
        } catch (e) {
          // ignore - best-effort only
        }
      })();
    </script>
